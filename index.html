<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Story: Abandoned but not Forgotten</title>
  <meta name="description" content="An interactive storybook about robot explorers left behind on the Moon, Mars and beyond.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;700&family=Share+Tech+Mono&display=swap">
  <link rel="stylesheet" href="css/style.css?v=3">
  <link rel="stylesheet" href="css/story.css?v=3">
</head>
<body>
  <main class="scene" id="app">
    <div class="book" id="book" data-state="closed">
      <button class="cover hud-frame" id="cover" type="button" aria-label="Open the book: My Story">
        <span class="cover-label">Mission log</span>
        <span class="cover-title">MY STORY</span>
        <span class="cover-rule" aria-hidden="true"></span>
        <span class="cover-sub">Robot explorers we left behind</span>
        <span class="cover-hint">Press to open</span>
      </button>

      <div class="spread" id="spread" hidden>
        <section class="page page-left" id="pageLeft" aria-label="Illustration"></section>
        <article class="page page-right" id="pageRight" tabindex="-1"></article>
      </div>
    </div>

    <nav class="controls" id="controls" aria-label="Book controls" hidden>
      <button type="button" id="prev" aria-label="Previous page">&larr; Back</button>
      <span id="counter" class="counter"></span>
      <button type="button" id="skip">Skip animation</button>
      <button type="button" id="next" aria-label="Next page">Next &rarr;</button>
    </nav>

    <p id="status" class="sr-only" aria-live="polite"></p>
    <noscript>This storybook needs JavaScript to turn its pages.</noscript>
  </main>
  <script src="js/typewriter.js?v=3"></script>
  <script src="js/story.js?v=3"></script>
  <script src="js/app.js?v=3"></script>
</body>
</html>
